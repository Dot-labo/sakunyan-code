name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Require an unpublished version for package changes
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changes=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- src package.json package-lock.json)
          if [[ -n "$changes" ]]; then
            decision=$(node scripts/publish-check.mjs)
            if ! test "$decision" = 'publish=true'; then
              echo '::error::Package changes need a new version. Run npm version patch --no-git-tag-version and include package.json/package-lock.json in the PR.'
              exit 1
            fi
          fi
